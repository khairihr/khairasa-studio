# Khairasa Studio - static site deploy config (Netlify)
# Works as-is on Vercel / GitHub Pages too: it is a plain static site, no build step.

[build]
  publish = "."
  command = ""

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
